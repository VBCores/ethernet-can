; Ethernet-CAN optional SD-card config.
; The board also has firmware defaults, so this file is only needed to override
; identity settings or to force an explicit static/P2P network address.

[device]
; Optional mDNS hostname. Use http://ethernetcan.local from the host.
hostname = ethernetcan

; Optional board MAC override. Normally leave this unset: firmware derives a
; locally administered MAC from the H7 hardware UID.
; mac_address = 02:00:00:00:00:00

[network]
; Default is DHCP. Explicit `dhcp = true` is accepted but not required.
dhcp = true

; Optional explicit static/P2P addressing. If device_ip is present, DHCP is
; disabled and these values are used instead.
; host_ip = 10.0.0.1
; device_ip = 10.0.0.2
; netmask = 255.255.255.0
; gateway = 0.0.0.0

; Backwards compatibility: old firmware also accepts the legacy [ethernet]
; section with host_ip/device_ip arrays:
; [ethernet]
; host_ip = [10, 0, 0, 1]
; device_ip = [10, 0, 0, 2]
